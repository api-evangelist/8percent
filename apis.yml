aid: 8percent
name: 8percent
description: >-
  8percent (에잇퍼센트) is a Seoul-based fintech company, founded in November 2014, that built
  Korea's first-generation peer-to-peer lending marketplace and in June 2021 became the
  country's first company registered as an Online Investment-linked Finance Business operator
  (온라인투자연계금융업 registration 2021-2) under the Financial Services Commission. Its platform
  matches retail and institutional investors with mid-credit borrowers, and has expanded from
  unsecured personal credit loans into real-estate-backed lending, stock-purchase loans,
  gig-worker financing, small-business loans and rental-deposit loans, underwriting them with an
  in-house AI credit-assessment model the company markets as "E-index". Cumulative originations
  are reported at roughly ₩1.4 trillion, and in July 2026 8percent acquired security-token
  operator A-Panda Partners to tokenize loan receivables. The service ships as a Korean-language
  consumer web app plus iOS and Android apps, served by a private first-party API host
  (core-api.8percent.kr) that the site's own production JavaScript names as its base. 8percent
  publishes no developer portal, no API reference, no SDK and no machine-readable contract of any
  kind; its public GitHub organization carries internal engineering tooling and study repos rather
  than API client libraries.
