result: none
notes: >-
  No well-known document is served anywhere on 8percent.kr. Two false-positive shapes had to be
  discounted and are recorded here so a later run does not re-credit them. (1) The 8percent.kr,
  www.8percent.kr and about.8percent.kr hosts are client-rendered single-page apps whose catch-all
  answers HTTP 200 with the same 11,631-byte HTML shell for ANY unmatched path — the identical
  body returned by the site root — so the 200s below on /.well-known/openid-configuration,
  /oauth-authorization-server, /oauth-protected-resource and /api-catalog are soft-404s, not
  documents. (2) api.8percent.kr and core-api.8percent.kr answer every /.well-known/* request with
  an nginx HTTP 403 page, which is an edge deny rule rather than a served document. No WellKnown
  or SecurityTxt pointer is wired in apis.yml, because nothing was actually served.
